        <p>Медиапроект «Движение мысли» нашёл отображение в образе сосны в корейском пейзаже тушью. Из этого образа возникла идея характера дерева и пейзажа, который меняется от движения руки под действием мысли.</p>

    <article aria-labelledby="original-title">
      <section class="poem" lang="ko" aria-labelledby="original-title">
        <h2 id="original-title">윤선도의 ‘오우가’</h2>
        <p>나의 벗이 몇이나 있느냐 헤아려 보니 물과 돌과 소나무, 대나무로다<br>
          동산에 달 오르니 그것 참 더욱 반갑구나<br>
          두어라! 이 다섯이면 그만이지 또 더하여 무엇 하리</p>
        <p>구름 빛이 좋다 하나 검기를 자주 한다<br>
          바람 소리 맑다 하나 그칠 때가 하도 많다<br>
          깨끗하고도 그치지 않은 것은 물뿐인가 하노라 【수(水)】</p>
        <p>꽃은 무슨 일로 피자마자 빨리 지고<br>
          풀은 어이하여 푸르다가 누래지는가<br>
          아마도 변치 않는 것은 바위뿐인가 하노라 【석(石)】</p>
        <p>더우면 꽃이 피고 추우면 잎 지거늘<br>
          솔아 너는 어찌 눈서리 모르는가<br>
          구천(九泉)에 뿌리 곧은 줄 그로하여 아노라 【송(松)】</p>
        <p>나무도 아닌 것이 풀도 아닌 것이<br>
          곧기는 누가 시키며 속은 어찌 비었는가<br>
          저리하고도 사시(四時)에 푸르니 그를 좋아하노라 【죽(竹)】</p>
        <p>작은 것이 높이 떠서 만물을 다 비추니<br>
          한밤중에 밝은 것이 너만 한 것 또 있느냐<br>
          보고도 말 아니하니 내 벗인가 하노라 【월(月)】</p>
      </section>
      <section class="poem" aria-labelledby="translation-title">
        <h2 id="translation-title">«Оуга» Юн Сон-до</h2>
        <p>Я посчитал, сколько у меня друзей, и это вода, камень, сосна и бамбук.<br>
          Луна восходит над холмом, и это поистине особенно приятно.<br>
          Оставьте это! Этих пяти достаточно; зачем добавлять ещё?</p>
        <p>Цвет облаков хороший, но они часто темнеют.<br>
          Шум ветра отчетливо слышен, но он так часто стихает.<br>
          Интересно, может быть, вода — единственное, что чисто и никогда не перестаёт существовать?</p>
        <p>По какой причине цветы быстро вянут сразу после распускания?<br>
          Почему трава желтеет после того, как была зеленой?<br>
          Пожалуй, единственное, что не меняется, — это скала.</p>
        <p>Цветы распускаются в жару, а листья опадают в холод.<br>
          Сол-а, как же так получилось, что ты не знаешь снега и инея?<br>
          Я знаю, что у него прямые корни в девяти источниках. 【Сосна】</p>
        <p>Что-то, что не является ни деревом, ни травой.<br>
          Кто приказал сделать его таким прямым, и почему внутри оно пустое?<br>
          Тем не менее, он остается зеленым на протяжении всех четырех времен года; мне это очень нравится. 【Бамбук】</p>
        <p>Нечто маленькое возвышается и освещает всё сущее.<br>
          Есть ли что-нибудь еще такое же яркое, как ты, посреди ночи?<br>
          Видя его, но не говоря ни слова, я задаюсь вопросом, друг ли он мне. 【Луна】</p>
        <footer class="credit">『Госан Юго』 Том. 6 Часть II, Дополнительный сборник, Гаса, Санджунг Сингок, «Ога»</footer>
      </section>

      for (let step = 1; step <= 24; step++) {

        const s = 1 - t;

            + 3 * s * t ** 2 * bx + t ** 3 * endX,
          y: s ** 3 * y + 3 * s ** 2 * t * ay
            + 3 * s * t ** 2 * by + t ** 3 * endY

      x = endX;
      y = endY;
    }

      const before = points[Math.max(0, i - 1)];
      const after = points[Math.min(points.length - 1, i + 1)];
      const angle = Math.atan2(after.y - before.y, after.x - before.x);
      return { ...point, angle, nx: -Math.sin(angle), ny: Math.cos(angle) };

      const distance = side * halfWidths[i] * random(0.83, 1.16);
      return [point.x + point.nx * distance, point.y + point.ny * distance];

    for (let i = Math.ceil(last * 0.18); i <= last; i += i < last * 0.45 ? 4 : 3) {

  const art = {

    scale: parameter("scale", 1, 0.85, 1.15),
    bend: parameter("bend", 0, -1, 1),
    north: parameter("north", 0.5, 0, 1),
    facesLeft: !result || query.get("left") === "1"
  };

  // Ветви отражаются относительно точек крепления на стволе.
  // Правый силуэт чуть уже, чтобы поместиться у края картины.
  const branchDirection = art.facesLeft ? 1 : -0.76;

  function faceBranch(root, curves) {
    return curves.map(curve => curve.map((coordinate, index) =>
      index % 2 === 0 ? root.x + (coordinate - root.x) * branchDirection : coordinate
    ));
  }

  function bendPoint({ x, y }) {
    const rise = (590 - y) / 500;
    return { x: x - art.bend * 75 * rise * rise, y };
  }

  function bendPath(path) {
    if (art.bend === 0) return path;
    return path.map(point => {
      const { x, y } = bendPoint(point);
      const dx = Math.cos(point.angle) + art.bend * 150 * (590 - y) / 250000 * Math.sin(point.angle);
      const angle = Math.atan2(Math.sin(point.angle), dx);
      return { x, y, angle, nx: -Math.sin(angle), ny: Math.cos(angle) };
    });
  }

  // Фиксированное зерно сохраняет рисунок при перезагрузке.
  let seed = 37;
  function random(min, max) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return min + (max - min) * seed / 4294967296;
  }

  function stroke(x, y, endX, endY, color, width) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  // В каждой строке две контрольные точки и конец кривой Безье.
  function samplePath(start, curves) {
    const points = [{ x: start[0], y: start[1] }];
    let [x, y] = start;

    for (const [ax, ay, bx, by, endX, endY] of curves) {
      for (let step = 1; step <= 24; step++) {
        const t = step / 24;
        const s = 1 - t;
        points.push({
          x: s ** 3 * x + 3 * s ** 2 * t * ax
            + 3 * s * t ** 2 * bx + t ** 3 * endX,
          y: s ** 3 * y + 3 * s ** 2 * t * ay
            + 3 * s * t ** 2 * by + t ** 3 * endY
        });
      }
      x = endX;
      y = endY;
    }

    return points.map((point, i) => {
      const before = points[Math.max(0, i - 1)];
      const after = points[Math.min(points.length - 1, i + 1)];
      const angle = Math.atan2(after.y - before.y, after.x - before.x);
      return { ...point, angle, nx: -Math.sin(angle), ny: Math.cos(angle) };
    });
  }

  function drawWood(path, baseWidth, tipWidth) {
    const last = path.length - 1;
    const halfWidths = path.map((_, i) =>
      (tipWidth + (baseWidth - tipWidth) * (1 - i / last) ** 1.2) / 2
    );

    function edge(point, i, side) {
      const distance = side * halfWidths[i] * random(0.83, 1.16);
      return [point.x + point.nx * distance, point.y + point.ny * distance];
    }

    ctx.beginPath();
    ctx.moveTo(...edge(path[0], 0, 1));
    for (let i = 1; i <= last; i++) ctx.lineTo(...edge(path[i], i, 1));
    for (let i = last; i >= 0; i--) ctx.lineTo(...edge(path[i], i, -1));
    ctx.closePath();
    ctx.fillStyle = "#373a37";
    ctx.fill();

    // Обрезка удерживает штрихи внутри силуэта коры.
    ctx.save();
    ctx.clip();

    const barkColors = ["#181e1b", "#515650", "#777b74", "#a5a79e"];
    for (let i = 0; i < last; i++) {
      const p = path[i];
      const q = path[Math.min(last, i + Math.floor(random(1, 5)))];

      for (let j = 0; j < 5; j++) {
        const offset = random(-1, 1) * halfWidths[i];
        const endOffset = offset + random(-2, 2);
        stroke(
          p.x + p.nx * offset, p.y + p.ny * offset,
          q.x + q.nx * endOffset, q.y + q.ny * endOffset,
          barkColors[Math.floor(random(0, barkColors.length))],
          random(0.5, 1.9)
        );
      }
    }

    ctx.restore();
  }

  const greens = ["#14201c", "#303b35", "#4d5550", "#777d76"];

  function drawNeedles(x, y, direction) {
    for (let i = 0; i < 34; i++) {
      const baseX = x + random(-18, 18);
      const baseY = y + random(-4, 4);
      const angle = direction + random(-0.7, 0.7);
      const length = random(4, 10);
      stroke(
        baseX, baseY,
        baseX + Math.cos(angle) * length, baseY + Math.sin(angle) * length,
        greens[Math.floor(random(0, greens.length))], random(0.6, 1.8)
      );
    }
  }

  function drawCrown(path, spread, forkAt = null) {
    const last = path.length - 1;

    // Редкие пучки у основания, более густые к концам.
    let tuft = 0;
    for (let i = Math.ceil(last * 0.18); i <= last; i += i < last * 0.45 ? 4 : 3) {
      const position = i / last;
      if (forkAt !== null && Math.abs(position - forkAt) < 0.09) continue;

      const p = path[i];
      const side = Math.cos(p.angle) < 0 ? -1 : 1;
      const below = tuft++ % 4 === 1;
      const reach = spread * (0.65 + 0.35 * position);
      const tipX = p.x + side * random(4, reach);
      const tipY = p.y + (below ? 0.8 : -1) * random(7, reach * 0.85);

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(tipX, p.y + random(-2, 7), tipX, tipY);
      ctx.strokeStyle = "#424943";
      ctx.lineWidth = random(0.9, 1.9);
      ctx.stroke();

      const direction = below ? Math.PI / 2 : -Math.PI / 2;
      drawNeedles(tipX, tipY, direction + random(-0.65, 0.65));
      if (position > 0.4) {
        drawNeedles((p.x + tipX) / 2, (p.y + tipY) / 2, direction);
      }
    }

    const tip = path[last];
    drawNeedles(tip.x, tip.y, -Math.PI / 2);
  }

  const landscape = {
    layers: [2, 3],
    blur: [4, 8],
    peakHeight: [95, 210],
    ridgeCount: [8, 12],
    fractalSteps: [2, 4],
    displacement: [15, 32],
    persistence: [0.47, 0.59]
  };

  function fractalRidge(anchors, base, peak, depth) {
    const [minSteps, maxSteps] = landscape.fractalSteps;
    const steps = Math.round(minSteps + (maxSteps - minSteps) * depth);
    const persistence = random(...landscape.persistence);
    let amplitude = random(...landscape.displacement) * (0.72 + depth * 0.28)
      * (result ? 0.40 + 1.20 * art.north : 1);
    let points = anchors;

    // На каждом проходе добавляем вершины между существующими точками.
    for (let step = 0; step < steps; step++) {
      const refined = [];
      for (let i = 1; i < points.length; i++) {
        const left = points[i - 1];
        const right = points[i];
        const t = random(0.35, 0.65);
        const y = left.y + (right.y - left.y) * t;
        const relief = Math.max(0, Math.min(1, (base - y) / peak));
        refined.push(left, {
          x: left.x + (right.x - left.x) * t,
          y: y + random(-amplitude, amplitude) * (0.24 + relief * 0.76)
        });
      }
      refined.push(points[points.length - 1]);
      points = refined;
      amplitude *= persistence;
    }

    return points;
  }

  function drawMountains() {
    const width = 820;
    const height = 850;
    ctx.fillStyle = "#f3f0e8";
    ctx.fillRect(0, 0, width, height);
    const count = Math.floor(random(landscape.layers[0], landscape.layers[1] + 1));

    for (let layer = 0; layer < count; layer++) {
      const depth = layer / (count - 1);
      const base = height * (0.44 + depth * 0.24) + random(-32, 24);
      const peak = random(...landscape.peakHeight) * (result ? 0.70 + 0.60 * art.north : 1);
      const focus = width * (layer % 2 === 0 ? random(0.59, 0.88) : random(0.11, 0.34));
      const countPoints = Math.floor(random(...landscape.ridgeCount));
      const anchors = [];

      for (let i = 0; i <= countPoints; i++) {
        const x = -50 + (width + 100) * i / countPoints + random(-14, 14);
        const mass = Math.exp(-(((x - focus) / (width * 0.25)) ** 2));
        const y = base - peak * mass * random(0.58, 1.16) - random(0, 32);
        anchors.push({ x, y });
      }

      const points = fractalRidge(anchors, base, peak, depth);
      const smoothing = result ? (1 - art.north) * 0.42 : 0;
      for (let i = 1; i < points.length - 1 && smoothing > 0; i++) {
        const point = points[i];
        point.y += ((points[i - 1].y + points[i + 1].y) / 2 - point.y) * smoothing;
      }

      function traceRidge() {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (const { x, y } of points.slice(1)) ctx.lineTo(x, y);
      }

      const crest = Math.min(...points.map(point => point.y));
      ctx.save();
      const blur = random(...landscape.blur) * (0.82 - depth * 0.42);
      ctx.filter = `blur(${blur}px)`;
      const wash = ctx.createLinearGradient(0, crest, 0, base + 35);
      wash.addColorStop(0, `rgba(41, 47, 43, ${0.24 + depth * 0.25})`);
      wash.addColorStop(0.36, `rgba(65, 71, 66, ${0.15 + depth * 0.20})`);
      wash.addColorStop(0.76, `rgba(96, 100, 92, ${0.04 + depth * 0.07})`);
      wash.addColorStop(1, "rgba(107, 111, 103, 0)");
      ctx.fillStyle = wash;
      traceRidge();
      ctx.lineTo(width + 60, base + 43);
      ctx.lineTo(-60, base + 43);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // На выступах больше туши, в седловинах кайма растворяется.
      const firstX = points[0].x;
      const lastX = points[points.length - 1].x;
      const rim = ctx.createLinearGradient(firstX, 0, lastX, 0);
      for (const { x, y } of points) {
        const elevation = Math.max(0, Math.min(1, (base - y) / (base - crest)));
        const opacity = 0.015 + elevation ** 2 * (0.34 + depth * 0.27);
        rim.addColorStop((x - firstX) / (lastX - firstX), `rgba(39, 44, 40, ${opacity})`);
      }

      ctx.save();
      traceRidge();
      ctx.strokeStyle = rim;
      ctx.lineJoin = "round";
      ctx.filter = `blur(${3.1 - depth * 1.25}px)`;
      ctx.lineWidth = 5.5 + depth * 3;
      ctx.stroke();
      ctx.filter = `blur(${0.95 - depth * 0.42}px)`;
      ctx.lineWidth = 0.8 + depth * 0.65;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawRock() {
    // Растушёвка стирает только нижний край скалы на отдельном слое.
    const layer = document.createElement("canvas");
    layer.width = 365;
    layer.height = 168;
    const ink = layer.getContext("2d");
    ink.translate(130, 29);

    function trace(points) {
      ink.beginPath();
      ink.moveTo(...points[0]);
      for (const point of points.slice(1)) ink.lineTo(...point);
    }

    const washes = [
      ["rgba(43, 49, 44, 0.42)", [[-103, 119], [-74, 54], [-35, 16],
        [1, -4], [36, -18], [56, -8], [72, -10], [92, 5],
        [113, 0], [136, 19], [173, 13], [198, 32], [207, 124]]],
      ["rgba(35, 40, 36, 0.53)", [[-80, 111], [-53, 59], [-9, 24],
        [36, 4], [62, -4], [43, 26], [8, 49], [-17, 93], [-33, 123]]],
      ["rgba(39, 45, 40, 0.46)", [[7, 126], [30, 79], [54, 53],
        [80, 27], [100, 29], [113, 10], [146, 32], [173, 22],
        [204, 40], [209, 124], [104, 107], [53, 129]]],
      ["rgba(96, 98, 87, 0.34)", [[-65, 80], [-38, 41], [-4, 20],
        [36, -12], [51, 2], [18, 20], [-12, 50], [-26, 76]]]
    ];

    for (const [color, points] of washes) {
      ink.filter = "blur(4px)";
      trace(points);
      ink.fillStyle = color;
      ink.fill();
    }

    ink.filter = "none";
    ink.lineCap = "round";
    ink.lineJoin = "bevel";
    const contours = [
      [3.3, [[-79, 62], [-63, 45], [-59, 37], [-30, 14], [-10, 0],
        [12, -8], [19, -9], [37, -18], [56, -8], [72, -10], [92, 5], [113, 0]]],
      [1.6, [[115, 1], [136, 19], [173, 13], [198, 32]]],
      [2.2, [[92, 5], [83, 32], [69, 52], [64, 79]]],
      [1.7, [[136, 19], [120, 35], [123, 51], [100, 77], [97, 98]]],
      [1.4, [[160, 26], [148, 52], [130, 72], [137, 89]]],
      [2.5, [[-49, 57], [-30, 44], [-21, 29], [1, 22], [23, 7], [34, 3]]],
      [1.1, [[-30, 62], [-15, 48], [2, 42], [17, 30], [35, 22], [45, 10]]],
      [2.1, [[15, 76], [31, 59], [46, 54], [65, 37]]],
      [1.3, [[60, 68], [77, 59], [92, 64], [103, 76]]],
      [0.8, [[-68, 78], [-77, 90], [-81, 104]]],
      [0.9, [[101, 82], [118, 92], [123, 101]]]
    ];

    for (const [width, points] of contours) {
      trace(points);
      ink.strokeStyle = "rgba(31, 35, 31, 0.37)";
      ink.lineWidth = width * 0.56;
      ink.setLineDash([width * 3, width * 1.7, width * 6.5, width * 2.1]);
      ink.stroke();
    }

    // Неровные сухие мазки поверх размытого пятна.
    ink.setLineDash([]);
    let grain = 923;
    function rockJitter() {
      grain = (Math.imul(grain, 1664525) + 1013904223) >>> 0;
      return grain / 0x100000000;
    }
    for (const [, points] of contours) {
      for (let i = 1; i < points.length; i++) {
        const [ax, ay] = points[i - 1];
        const [bx, by] = points[i];
        for (let j = 0; j < 12; j++) {
          const t = rockJitter();
          const x = ax + (bx - ax) * t + (rockJitter() - 0.5) * 6;
          const y = ay + (by - ay) * t + (rockJitter() - 0.5) * 7;
          ink.beginPath();
          ink.moveTo(x, y);
          ink.lineTo(x + (bx - ax) * 0.17, y + (by - ay) * 0.17);
          ink.strokeStyle = `rgba(33, 38, 34, ${rockJitter() * 0.43})`;
          ink.lineWidth = 0.35 + rockJitter() * 1.15;
          ink.stroke();
        }
      }
    }

    const fade = ink.createLinearGradient(0, 58, 0, 123);
    fade.addColorStop(0, "rgba(0, 0, 0, 0)");
    fade.addColorStop(0.55, "rgba(0, 0, 0, 0.72)");
    fade.addColorStop(1, "rgba(0, 0, 0, 1)");
    ink.globalCompositeOperation = "destination-out";
    ink.fillStyle = fade;
    ink.fillRect(-130, 58, layer.width, layer.height - 58);

    ctx.drawImage(layer, 505, 704);
  }

    2028-12-23T21:45Z 2028-12-31T16:48Z
  `.trim().split(/\s+/).map(value => Date.parse(value));

  let dateOfArtwork, lunarLabel, moonAngle;

  function moonPhaseAngle(date) {
    const time = date.getTime();
    const index = moonQuarters.findIndex(quarter => quarter > time) - 1;
    if (index < 0) return null;
    const start = moonQuarters[index];
    const fraction = (time - start) / (moonQuarters[index + 1] - start);
    return ((index + 1 + fraction) % 4) * Math.PI / 2;
  }

  function drawMoon(x, y, phase) {
    const radius = 6;
    const side = phase < Math.PI ? 1 : -1;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#5e675c";
    ctx.beginPath();
    ctx.moveTo(0, -radius);
    for (let i = 1; i <= 16; i++) {
      const angle = Math.PI * i / 16;
      ctx.lineTo(side * radius * Math.sin(angle), -radius * Math.cos(angle));
    }
    for (let i = 15; i >= 0; i--) {
      const angle = Math.PI * i / 16;
      ctx.lineTo(side * radius * Math.sin(angle) * Math.cos(phase), -radius * Math.cos(angle));
    }
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#5e675c80";
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  function drawCalendar(inset) {
    const ornamentClearance = inset + 45;
    ctx.save();
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#303b35";
    ctx.font = '600 35px "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
    ctx.fillText(koreanDay.format(dateOfArtwork), ornamentClearance, inset + 44);

    ctx.font = "17px system-ui, sans-serif";
    ctx.fillStyle = "#596257";
    ctx.shadowColor = "#39453c60";
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;
    ctx.shadowBlur = 5;
    ctx.fillText(russianDay.format(dateOfArtwork), ornamentClearance, inset + 90);

    ctx.shadowColor = "transparent";
    ctx.font = '15px "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
    ctx.fillStyle = "#4b554e";
    ctx.textBaseline = "bottom";
    const bottom = canvas.height - inset - 27;
    ctx.fillText(calendarDate.format(dateOfArtwork), ornamentClearance, bottom - (lunarLabel ? 22 : 0));
    if (lunarLabel) {
      ctx.font = '12px "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
      ctx.fillStyle = "#60695f";
      if (moonAngle !== null) drawMoon(ornamentClearance + 6, bottom - 7, moonAngle);
      ctx.fillText(lunarLabel, ornamentClearance + (moonAngle === null ? 0 : 20), bottom);
    }
    ctx.restore();
  }

  function drawFrame() {
    const { width, height } = canvas;
    const index = (Math.imul(art.seed, 0x9e3779b1) >>> 0) % frameStyles.length;
    const { outer, inner, inset, gap, marks } = frameStyles[index];
    ctx.save();
    ctx.strokeStyle = outer;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(inset, inset, width - inset * 2, height - inset * 2);
    const inside = inset + gap;
    ctx.strokeStyle = inner;
    ctx.lineWidth = 0.8;
    ctx.strokeRect(inside, inside, width - inside * 2, height - inside * 2);

    for (const sx of [-1, 1]) {
      for (const sy of [-1, 1]) {
        ctx.save();
        ctx.translate(sx === 1 ? inset : width - inset, sy === 1 ? inset : height - inset);
        ctx.scale(sx, sy);
        for (const [index, [start, ...points]] of marks.entries()) {
          ctx.beginPath();
          ctx.moveTo(...start);
          for (const point of points) ctx.lineTo(...point);
          ctx.strokeStyle = index % 2 === 0 ? outer : inner;
          ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.restore();
    drawCalendar(inset);
  }

  const ribbonColors = [
    ["#325c99", "#8faedd"], ["#a8353d", "#e78581"],
    ["#397350", "#93bb8b"], ["#b28622", "#ead276"],
    ["#b95f26", "#e9a371"], ["#ad577f", "#e5a0be"],
    ["#715492", "#bda5d9"]
  ];
  const backdrop = document.createElement("canvas");
  backdrop.width = canvas.width;
  backdrop.height = canvas.height;
  const backdropCtx = backdrop.getContext("2d");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let ribbonFrame, ribbonSeed, ribbonAnchor, ribbonStarted;

  function positionForeground() {
    ctx.translate(43, 23);
  }

  function positionTree() {
    ctx.translate(790, 310);
    ctx.scale(-0.74, 0.74);
    ctx.translate(200, 590);
    ctx.scale(art.scale, art.scale);
    ctx.translate(-200, -590);
  }

  function drawRockNotch() {
    ctx.save();
    positionForeground();
    ctx.translate(642, 746);
    for (const [color, points] of [
      ["#50544b", [[-27, 21], [-21, 1], [-13, -9], [-7, -3], [-2, -12],
                   [5, -5], [13, -7], [20, 2], [29, 3], [34, 20], [11, 35]]],
      ["#797b6d", [[-23, 16], [-13, -9], [-7, -3], [-2, -12], [5, -5], [1, 10], [-10, 15]]],
      ["#353b35", [[1, 10], [13, -7], [20, 2], [29, 3], [24, 15], [9, 25]]]
    ]) {
      ctx.beginPath();
      ctx.moveTo(...points[0]);
      for (const point of points.slice(1)) ctx.lineTo(...point);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }
    stroke(-13, -6, -3, 7, "#a7a79888", 1.1);
    stroke(13, -4, 11, 14, "#a7a79855", 0.8);
    ctx.restore();
  }

  function windNoise(time, salt, interval) {
    const sample = time / interval;
    const step = Math.floor(sample);
    const t = sample - step;
    const blend = t * t * (3 - 2 * t);
    function value(index) {
      let hash = Math.imul(index ^ ribbonSeed ^ salt, 0x9e3779b1);
      hash = Math.imul(hash ^ (hash >>> 16), 0x85ebca6b);
      return ((hash ^ (hash >>> 13)) >>> 0) / 0xffffffff * 2 - 1;
    }
    return value(step) * (1 - blend) + value(step + 1) * blend;
  }

  function drawRibbon(time) {
    const { x, y } = ribbonAnchor;
    const variant = (Math.imul(ribbonSeed, 0x85ebca6b) >>> 0);
    const [dark, light] = ribbonColors[variant % ribbonColors.length];
    const side = variant & 8 ? 1 : -1;
    const gust = windNoise(time, 41, 2900);
    const angle = 0.30 + ((variant >>> 8) % 100 / 100) * 0.28 + gust * 0.24;
    const angleX = side * Math.cos(angle);
    const angleY = Math.sin(angle);
    const tail = [];
    for (let i = 0; i <= 22; i++) {
      const t = i / 22;
      const flutter = Math.sin(t * 7.6 + (variant & 7)) * 12 * t
        + windNoise(time - 1300 * t, 73, 1450) * 14 * t * t;
      tail.push({
        x: x + angleX * t * (94 + gust * 10.5) - angleY * flutter,
        y: y + 4 + angleY * t * 67 + angleX * flutter
      });
    }
    ctx.save();
    ctx.translate(-82, -128);
    positionForeground();
    positionTree();
    const tip = tail[tail.length - 1];
    const dye = ctx.createLinearGradient(x, y, tip.x, tip.y);
    dye.addColorStop(0, dark);
    dye.addColorStop(0.54, light);
    dye.addColorStop(1, dark);
    ctx.beginPath();
    ctx.moveTo(x - 4, y + 4);
    for (const [index, p] of tail.entries()) {
      const width = 4 + 2 * Math.sin(index / 22 * Math.PI);
      ctx.lineTo(p.x - angleY * width, p.y + angleX * width);
    }
    ctx.lineTo(tip.x - angleX * 5, tip.y - angleY * 5);
    for (const [index, p] of tail.entries()) {
      const width = 4 + 2 * Math.sin(index / 22 * Math.PI);
      const q = tail[tail.length - 1 - index];
      ctx.lineTo(q.x + angleY * width, q.y - angleX * width);
    }
    ctx.closePath();
    ctx.fillStyle = dye;
    ctx.fill();
    stroke(x - 4, y - 3, x + 4, y + 4, dark, 3);
    ctx.restore();
  }

  function animateRibbon(now) {
    ctx.drawImage(backdrop, 0, 0);
    ribbonStarted ??= now;
    drawRibbon(reducedMotion.matches ? 0 : now - ribbonStarted);
    if (result) drawFrame();
    if (!reducedMotion.matches) ribbonFrame = requestAnimationFrame(animateRibbon);
  }

  function chooseRibbonAnchor(points) {
    const visible = points.filter(({ x, y }) => {
      const screenX = 751 - 0.74 * (200 + (x - 200) * art.scale);
      const screenY = 205 + 0.74 * (590 + (y - 590) * art.scale);
      return screenX > 115 && screenX < canvas.width - 115 &&
             screenY > 35 && screenY < canvas.height - 92;
    });
    const choices = visible.length ? visible : points;
    let hash = Math.imul(ribbonSeed ^ (ribbonSeed >>> 16), 0x7feb352d);
    hash = Math.imul(hash ^ (hash >>> 15), 0x846ca68b);
    return choices[((hash ^ (hash >>> 16)) >>> 0) % choices.length];
  }

  function render() {
    if (ribbonFrame !== undefined) cancelAnimationFrame(ribbonFrame);
    seed = result ? art.seed : Math.floor(Math.random() * 0x100000000);
    ribbonSeed = seed;
    dateOfArtwork = new Date();
    lunarLabel = result && lunarFormatter.resolvedOptions().calendar === "dangi"
      ? "음력 · " + lunarFormatter.format(dateOfArtwork)
      : "";
    moonAngle = lunarLabel ? moonPhaseAngle(dateOfArtwork) : null;
    ctx.save();
    ctx.translate(-82, -128);
    drawMountains();

    ctx.save();
    positionForeground();
    drawRock();

    seed = 37;
    positionTree();
    ctx.lineCap = "round";
    drawWood(bendPath(trunk), 54, 1.6);

    const ribbonPoints = [];
    for (const [index, branch] of branches.entries()) {
      const root = trunk[branch.start];
      const path = samplePath([root.x, root.y], faceBranch(root, branch.curves));
      const offshoot = offshoots[index + 1];

      const bent = bendPath(path);
      for (const point of [24, 38, 52]) ribbonPoints.push(bent[point]);
      drawWood(bent, branch.width, 1);
      if (offshoot) drawOffshoot(path, offshoot);
      drawCrown(bent, branch.spread, offshoot?.at);
    }

    ribbonAnchor = chooseRibbonAnchor(ribbonPoints);

    // Небольшой пучок хвои на верхушке ствола.
    for (const p of trunk.slice(-18).filter((_, i) => i % 3 === 0)) {
      const tip = bendPoint(p);
      drawNeedles(tip.x, tip.y, -Math.PI / 2);
    }
    ctx.restore();
    drawRockNotch();
    ctx.restore();
    backdropCtx.drawImage(canvas, 0, 0);
    ribbonStarted = undefined;
    ctx.drawImage(backdrop, 0, 0);
    drawRibbon(0);
    if (result) drawFrame();
    if (!reducedMotion.matches) ribbonFrame = requestAnimationFrame(animateRibbon);
  }

  const regenerate = document.querySelector("#regenerate");
  regenerate.hidden = result;
  regenerate.addEventListener("click", render);
  document.querySelector("#result-actions").hidden = !result;
  document.querySelector("#save-art").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "движение-мысли.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
  render();

  }
  const screens = {
    home: init_home, menu: init_menu, movement: init_movement,
    thoughts: init_thoughts, landscape: init_landscape
  };
  const titles = {
    home: "Движение мысли",
    menu: "Движение мысли · Меню",
    movement: "Движение · Движение мысли",
    thoughts: "Мысли · Движение мысли",
    landscape: "Фрактальное дерево",
    afterword: "Послесловие · Движение мысли"
  };
  const host = document.querySelector("#app");
  const root = host.attachShadow({ mode: "open" });
  let currentRoute, stopScreen;

  function navigate(screen, params) {
    const suffix = params?.toString();
    location.hash = screen + (suffix ? "?" + suffix : "");
  }

  function mount() {
    const [fragment, search = ""] = location.hash.slice(1).split("?", 2);
    const name = Object.hasOwn(screens, fragment) || fragment === "afterword" ? fragment : "home";
    const key = name + "?" + search;
    if (key === currentRoute) return;
    currentRoute = key;
    stopScreen?.();

    const target = name === "afterword" ? "menu" : name;
    const template = document.querySelector("#screen-" + target);
    host.dataset.screen = name;
    root.replaceChildren(template.content.cloneNode(true));
    document.title = titles[name];
    window.scrollTo(0, 0);

    const controller = new AbortController();
    const frames = new Set();
    stopScreen = () => {
      controller.abort();
      for (const id of frames) window.cancelAnimationFrame(id);
      frames.clear();
    };

    const screenDocument = {
      querySelector: selector => root.querySelector(selector),
      createElement: tag => document.createElement(tag)
    };
    screens[target](screenDocument, {
      signal: controller.signal,
      search,
      navigate,
      requestAnimationFrame(callback) {
        if (controller.signal.aborted) return;
        const id = window.requestAnimationFrame(time => {
          frames.delete(id);
          if (!controller.signal.aborted) callback(time);
        });
        frames.add(id);
        return id;
      },
      cancelAnimationFrame(id) {
        frames.delete(id);
        window.cancelAnimationFrame(id);
      }
    });
  }

  root.addEventListener("click", event => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey ||
        event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target.closest('a[href="#"]');
    if (!link) return;
    event.preventDefault();
    history.pushState(null, "", location.pathname + location.search);
    mount();
  });
  if (location.protocol !== "file:" && location.pathname.endsWith("/index.html")) {
    history.replaceState(history.state, "", "./" + location.search + location.hash);
  }
  window.addEventListener("hashchange", mount);
  window.addEventListener("popstate", mount);
  mount();
  </script>
